<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daymark</title>
<meta name="description" content="Daymark: a daily check-list. Habits on a month sheet, to-dos for today and later. Works offline, data stays on your device.">
<meta name="theme-color" content="#f2f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daymark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/instrument-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="nav" data-i18n-aria="navLabel">
    <div class="brand">Day<em>mark</em></div>
    <div class="tabs" id="tabs"></div>
    <button class="btn newbtn" id="newBtn" type="button" data-i18n="newItem"></button>
    <div class="sync" data-i18n="savedLocal"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
  <aside id="aside" data-i18n-aria="thisWeek"></aside>
</div>
<button class="fab" id="fab" type="button" data-i18n-aria="newItem">+</button>

<div class="overlay" id="overlay">
  <form class="dialog" id="form" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" novalidate>
    <h3 id="dlgTitle"></h3>
    <div class="field"><label for="fTitle" data-i18n="what"></label><input type="text" id="fTitle" maxlength="120" data-i18n-ph="whatPh" autocomplete="off"></div>
    <div class="field"><span class="lab" data-i18n="howOften"></span>
      <div class="seg" id="fKind">
        <button type="button" data-v="once" data-i18n="once"></button>
        <button type="button" data-v="daily" data-i18n="everyDay"></button>
        <button type="button" data-v="days" data-i18n="someDays"></button>
      </div>
    </div>
    <div class="field" id="fWhenWrap"><span class="lab" data-i18n="when"></span>
      <div class="seg" id="fWhen">
        <button type="button" data-v="today" data-i18n="today"></button>
        <button type="button" data-v="tomorrow" data-i18n="tomorrow"></button>
        <button type="button" data-v="date" data-i18n="pickDate"></button>
        <button type="button" data-v="none" data-i18n="later"></button>
      </div>
      <input type="date" id="fDate" data-i18n-aria="dateLabel">
    </div>
    <div class="field" id="fDaysWrap"><span class="lab" data-i18n="whichDays"></span><div class="wd" id="fDays"></div></div>
    <div class="field"><label for="fGroup" data-i18n="section"></label>
      <select id="fGroup"></select>
      <input type="text" id="fNewGroup" maxlength="40" data-i18n-ph="newSectionName" data-i18n-aria="newSectionName">
    </div>
    <div class="field" id="fPosWrap"><span class="lab" data-i18n="position"></span>
      <div class="btnrow">
        <button type="button" class="btn ghost" id="fUp" data-i18n="moveUpBtn"></button>
        <button type="button" class="btn ghost" id="fDown" data-i18n="moveDownBtn"></button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="fDelete"></button>
      <span class="sp"></span>
      <button type="button" class="btn ghost" id="fCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn" id="fSave" data-i18n="save"></button>
    </div>
  </form>
</div>

<div class="overlay" id="secDlg">
  <form class="dialog" id="sForm" role="dialog" aria-modal="true" aria-labelledby="sTitle" novalidate>
    <h3 id="sTitle" data-i18n="sectionTitle"></h3>
    <div class="field"><label for="sName" data-i18n="nameLabel"></label><input type="text" id="sName" maxlength="40" autocomplete="off"></div>
    <div class="field"><span class="lab" data-i18n="position"></span>
      <div class="btnrow">
        <button type="button" class="btn ghost" id="sUp" data-i18n="moveUpBtn"></button>
        <button type="button" class="btn ghost" id="sDown" data-i18n="moveDownBtn"></button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="sDelete" data-i18n="deleteSectionBtn"></button>
      <span class="sp"></span>
      <button type="submit" class="btn" id="sDone" data-i18n="doneBtn"></button>
    </div>
  </form>
</div>

<div class="overlay" id="confirm">
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cBody">
    <h3 id="cTitle"></h3>
    <p id="cBody"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="cCancel" data-i18n="cancel"></button>
      <button type="button" class="btn danger solid" id="cOk"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<noscript><p style="padding:24px">Daymark needs JavaScript to run.</p></noscript>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
